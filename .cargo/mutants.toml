# cargo-mutants configuration (`cargo mutants`). Run it on one change at a
# time, in the tree, so it shares the host's build lock and target directory:
#
#   cargo mutants --in-place --in-diff <diff file>
#
# `--in-place` is command-line only and runs one mutant at a time (it cannot
# be combined with `--jobs`).
#
# Product crates test under the environment `cargo xtask test` builds (the
# AWS_NATIVE_* dependency prefixes, the managed CC/AR/RANLIB, the musl linker
# and rustflags) and for the shipped target; there is no xtask command that
# exports it yet. Without it the baseline fails (for example model's
# CPython-oracle tests), and no mutant runs. Pass the target per host:
#
#   cargo mutants --in-place --in-diff <diff> --cargo-arg=--target --cargo-arg=<target>

additional_cargo_args = ["--locked"]

# Mutated code may trip the workspace's deny lints (dead_code, unused
# dependencies, clippy denies); cap them so a mutant fails only on its tests.
cap_lints = true

# Each mutant's test run may take this many times the baseline `cargo test`
# before it counts as a timeout (a mutant that hangs a loop).
timeout_multiplier = 3.0
minimum_test_timeout = 60

# Per-crate test command: a mutant runs only the tests of the package that
# contains it (`cargo test -p <package>`), not the whole workspace. This is the
# fast default. A mutant that only another crate's tests kill (the
# customizations parity and census tests, the service-errors Python-route
# tests, the blackbox suite) is reported MISSED; triage such survivors by
# re-running with `--test-workspace=true` before writing a test.
test_workspace = false

# Product code only. xtask is dev tooling, fuzz is a separate workspace, and
# test-only files would only mutate the tests themselves.
exclude_globs = [
  "xtask/**",
  "fuzz/**",
  "tests/**",
  "**/tests/**",
  "**/tests.rs",
  "**/benches/**",
  # Cargo build scripts sit at a crate root; a build.rs deeper in src/ is a
  # product module (crates/model/src/shapes/build.rs).
  "crates/*/build.rs",
]
