[package]
name = "client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The in-memory transport and the fixed runtime, for tests.
testing = []

[dependencies]
cli-core = { path = "../cli-core" }
credentials = { path = "../credentials" }
crt = { path = "../crt" }
model = { path = "../model" }
sigv4 = { path = "../sigv4" }
timestamp = { path = "../timestamp" }

[dev-dependencies]
awscli-argparse = { path = "../awscli-argparse", features = ["testing"] }
crt = { path = "../crt", features = ["loopback"] }
# The census counts refusals with the CLI's own customizations.
customizations = { path = "../customizations" }
model = { path = "../model", features = ["testing"] }
sigv4 = { path = "../sigv4", features = ["testing"] }
timestamp = { path = "../timestamp", features = ["testing"] }
serde_json.workspace = true

[lints]
workspace = true
