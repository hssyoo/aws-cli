[package]
name = "client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The in-memory transport and the fixed runtime, for tests.
testing = []

[dependencies]
cli-core = { path = "../cli-core" }
credentials = { path = "../credentials" }
crt = { path = "../crt" }
# The rules engine every endpoint resolves with.
endpoint-rules = { path = "../endpoint-rules" }
# The JMESPath engine operationContextParams paths evaluate with.
jmespath = { path = "../jmespath" }
model = { path = "../model" }
pytext = { path = "../pytext" }
sigv4 = { path = "../sigv4" }
timestamp = { path = "../timestamp" }
# The type of a resolved endpoint's properties.
serde_json.workspace = true

[dev-dependencies]
awscli-argparse = { path = "../awscli-argparse", features = ["testing"] }
crt = { path = "../crt", features = ["loopback"] }
model = { path = "../model", features = ["testing"] }
pytext = { path = "../pytext", features = ["testing"] }
sigv4 = { path = "../sigv4", features = ["testing"] }
timestamp = { path = "../timestamp", features = ["testing"] }

[lints]
workspace = true
