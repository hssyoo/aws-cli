rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
download-writer-debug = []
testing = ["dep:arbitrary"]

[dependencies]
libc.workspace = true
numa = { path = "../numa" }
crt = { path = "../crt" }
endpoint-rules = { path = "../endpoint-rules" }
credentials = { path = "../credentials" }
pyload = { path = "../pyload" }
pytext = { path = "../pytext" }
model = { path = "../model" }
sigv4 = { path = "../sigv4" }
cli-core = { path = "../cli-core" }
awscli-config = { path = "../awscli-config" }
awscli-argparse = { path = "../awscli-argparse" }
arbitrary = { workspace = true, optional = true }

[dev-dependencies]
arbitrary.workspace = true
pyload = { path = "../pyload", features = ["testing"] }

[lints]
workspace = true
