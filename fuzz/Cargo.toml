[package]
name = "source-pool-fuzz"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
s3 = { path = "../crates/s3", features = ["testing", "download-writer-debug"] }
libfuzzer-sys = "=0.4.13"
crt = { path = "../crates/crt", features = ["testing"] }
client = { path = "../crates/client", features = ["testing"] }
model = { path = "../crates/model", features = ["testing"] }
timestamp = { path = "../crates/timestamp", features = ["testing"] }
awscli-argparse = { path = "../crates/awscli-argparse", features = ["testing"] }

[[bin]]
name = "pool_reservations"
path = "fuzz_targets/pool_reservations.rs"
